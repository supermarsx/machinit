name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-format:
    name: Apply Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install shfmt (pinned)
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/mvdan/sh/releases/download/v3.12.0/shfmt_v3.12.0_linux_amd64"
          echo "Downloading shfmt from: $URL"
          curl -fsSL -o /tmp/shfmt "$URL"
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install black
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install black

      - name: Apply formatting first
        shell: bash
        run: |
          set -euo pipefail
          find . -name "*.sh" -not -path "*/node_modules/*" -print0 | xargs -0 shfmt -w -i 4 -ci
          python -m black .

      - name: Update generated inventory
        shell: bash
        run: |
          set -euo pipefail
          python ./dev_scripts/generate_inventory.py

      - name: Auto-commit formatting changes (push or same-repo PRs)
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply code formatting (shfmt/black)" || true

          BRANCH_NAME="${{ github.head_ref }}"
          if [ -n "$BRANCH_NAME" ]; then
            git push origin "HEAD:$BRANCH_NAME"
          else
            git push
          fi

          echo "Formatting changes pushed. Re-run will start on the new commit."
          exit 0

      - name: Fail if formatting changed (fork PRs)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi

          echo "Formatting changes detected." >&2
          echo "Run ./dev_scripts/format.sh locally and commit the result." >&2
          git --no-pager diff --name-only >&2
          exit 1

      - name: Upload formatted workspace
        uses: actions/upload-artifact@v4
        with:
          name: formatted-worktree
          path: |
            .
            !.git/**

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [apply-format]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download formatted workspace
        uses: actions/download-artifact@v4
        with:
          name: formatted-worktree
          path: .

      - name: Install ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install flake8
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install flake8

      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          find . -name "*.sh" -not -path "*/node_modules/*" -print0 |
            xargs -0 shellcheck --severity=error -e SC1091,SC2155

      - name: Run flake8
        shell: bash
        run: |
          set -euo pipefail
          python -m flake8 . --exclude=node_modules,venv,.venv,.git,__pycache__ --max-line-length=120

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    needs: [apply-format]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download formatted workspace
        uses: actions/download-artifact@v4
        with:
          name: formatted-worktree
          path: .

      - name: Install shfmt (pinned)
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/mvdan/sh/releases/download/v3.12.0/shfmt_v3.12.0_linux_amd64"
          echo "Downloading shfmt from: $URL"
          curl -fsSL -o /tmp/shfmt "$URL"
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install black
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install black

      - name: Run shfmt check
        shell: bash
        run: |
          set -euo pipefail
          UNFORMATTED=$(find . -name "*.sh" -not -path "*/node_modules/*" -print0 | xargs -0 shfmt -l || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following shell files need shfmt formatting:" >&2
            echo "$UNFORMATTED" >&2
            exit 1
          fi

      - name: Run black --check
        shell: bash
        run: |
          set -euo pipefail
          python -m black --check .

  text-check:
    name: Text Check
    runs-on: ubuntu-latest
    needs: [apply-format]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download formatted workspace
        uses: actions/download-artifact@v4
        with:
          name: formatted-worktree
          path: .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Docs inventory is up-to-date
        shell: bash
        run: |
          set -euo pipefail
          python ./dev_scripts/generate_inventory.py
          git diff --exit-code -- docs/inventory.md

  test-dry-run:
    name: Test (macOS dry-run)
    runs-on: macos-latest
    needs: [apply-format, lint, format-check, text-check]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download formatted workspace
        uses: actions/download-artifact@v4
        with:
          name: formatted-worktree
          path: .

      - name: Run install script in dry-run mode
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./install.sh || true
          chmod +x ./tests/*.sh || true

          ./install.sh --dry-run
          ./tests/test_ui_flags.sh
          ./tests/test_resume_and_logs.sh
          ./tests/test_terminal_theme.sh
          ./tests/test_system_accent.sh
          ./tests/test_set_user_default_integration.sh
          ./tests/test_integrity.sh

  test-suite:
    name: Test (macOS full suite)
    runs-on: macos-latest
    needs: [apply-format, lint, format-check, text-check]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download formatted workspace
        uses: actions/download-artifact@v4
        with:
          name: formatted-worktree
          path: .

      - name: Run full test suite
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./tests/*.sh || true

          ./tests/test_ui_flags.sh
          ./tests/test_resume_and_logs.sh
          ./tests/test_set_user_default_integration.sh
          ./tests/test_terminal_theme.sh
          ./tests/test_system_accent.sh
          ./tests/test_integrity.sh
